name: Python syntax validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate supported Python 3 examples
        run: |
          python -m py_compile \
            LedBlink/LedBlink.py \
            Serial/serial_test.py \
            PyQt5/message_box/msg_box.py
